<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', serif;
            background: #0a0a0a;
            color: #f0e8dc;
            background-image: url('./img/背景.jpg');
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 8, 5, 0.4);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            backdrop-filter: blur(1px);
            z-index: -1;
        }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px 48px; position: relative; z-index: 2; }
        .navbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 24px 0 20px; border-bottom: 1px solid rgba(218, 185, 118, 0.2); margin-bottom: 32px; }
        .logo h1 { font-size: 1.9rem; background: linear-gradient(135deg,#f5e2b0,#c9a962); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .nav-links a { color: #fdf3e0; text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; padding-bottom: 6px; }
        .nav-links a:hover, .nav-links a.active { color: #ffd97c; border-bottom-color: #ffd97c; }
        .chain-badge { background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 40px; border: 1px solid rgba(201, 169, 98, 0.3); }
        .page-title { font-size: 2rem; margin: 20px 0 30px; border-left: 6px solid #e0b06e; padding-left: 20px; color: #ffe8bf; }
        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 50px; }
        .card { background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);border-radius: 28px; padding: 20px; border: 1px solid rgba(218, 185, 118, 0.2); }
        .card h3 { font-size: 1.4rem; margin-bottom: 16px; color: #ffe2a4; }
        .person-list { display: flex; flex-direction: column; gap: 15px; }
        .person-item { display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(218,185,118,0.15); padding-bottom: 12px; }
        .person-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .person-info h4 { margin-bottom: 4px; }
        .btn-link { background: none; border: 1px solid rgba(214, 168, 91, 0.6); padding: 5px 12px; border-radius: 20px; color: #ffefcf; cursor: pointer; margin-top: 8px; display: inline-block; font-size: 0.8rem; text-decoration: none; }
        .btn-link:hover { background: rgba(214,168,91,0.2); }
        .interact-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; margin-top: 15px; }
        .interact-item { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 20px; text-align: center; cursor: pointer; border: 1px solid rgba(218,185,118,0.15); }
        footer { text-align: center; padding: 32px 0 16px; font-size: 0.75rem; border-top: 1px solid rgba(190, 156, 96, 0.2); margin-top: 40px; }
        @media (max-width: 800px) { .two-columns { grid-template-columns: 1fr; } .navbar { flex-direction: column; gap: 16px; } }
    </style>
</head>
